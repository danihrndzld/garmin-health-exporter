# Runs the same command as the local pipeline (go run -C tools . ci, stage test) and uploads
# its report: JUnit per suite, Go coverage, report.html, report.pdf and summary.html. The
# command also writes the verdict and the suites table to the job summary.
# macOS, as the app: the layout checks are calibrated for macOS fonts (CL-11 overflowed by
# 5 px on Ubuntu Chromium on 2026-10-25), and cargo needs the macOS Tauri toolchain.
name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CI: "1"
      ART_OF_CICD: ${{ github.workspace }}/.skills/skills/testing/art-of-cicd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # build_report.py (stdlib only) from the art-of-cicd skill, pinned by commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: danihrndzld/skills
          ref: bd347d01166a96de42464072c1d513693389488e
          path: .skills
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: tauri-app/core/go.mod
          cache-dependency-path: |
            tauri-app/core/go.sum
            tools/go.sum
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - name: install
        working-directory: tauri-app
        run: bun install --frozen-lockfile && bunx playwright install chromium webkit
      - name: test suites and report
        run: go run -C tools . test-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-report
          path: tauri-app/reportes-pruebas/
          retention-days: 30
